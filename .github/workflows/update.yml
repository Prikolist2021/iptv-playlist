name: Update IPTV playlist

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run pipeline
        run: python3 update_iptv.py
      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add ru_sorted.m3u README.md
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "auto-update $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi
